# ============================================================
# Configuration de l'upload (Sprint 8)
# ============================================================
# Chemin de stockage. Un chemin absolu est recommande en production,
# par exemple : upload.directory=/var/lib/monapp/uploads
# Un chemin relatif est resolu par rapport a catalina.base (Tomcat)
# ou, a defaut, au repertoire de travail.
upload.directory=uploads

# Taille maximale d'un fichier, en octets (ici 5 Mo).
# Ne peut pas depasser le plafond dur de @MultipartConfig (50 Mo).
upload.max-size=5242880

# Extensions autorisees (liste blanche, separees par des virgules).
upload.allowed-extensions=jpg,jpeg,png,gif,pdf,txt,doc,docx,xls,xlsx,zip
